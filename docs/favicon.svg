<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2447D6"/>
      <stop offset="1" stop-color="#08124F"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE4FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB340"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFE680"/>
      <stop offset="1" stop-color="#F5B300"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(512 512)" filter="url(#lift)">
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#accent)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(30)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(90)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(150)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(210)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(240)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(270)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(300)"/>
    <ellipse cx="0" cy="-200" rx="44" ry="128" fill="url(#petal)" transform="rotate(330)"/>
    <circle r="106" fill="url(#core)"/>
  </g>
</svg>
