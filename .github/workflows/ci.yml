name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: scripts/package.sh "0.0.0-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: Petal
          path: dist/Petal.zip
          retention-days: 14
